<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 660" font-family="'Times New Roman','SimSun','STSong',serif">
  <!-- ===== 背景 ===== -->
  <rect width="1510" height="660" fill="#FFFFFF"/>

  <!-- ===== 总标题 ===== -->
  <text x="755" y="26" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">电商订单全流程</text>
  <text x="755" y="42" font-size="11" font-style="italic" fill="#555555" text-anchor="middle">E-commerce Order Lifecycle</text>

  <!-- ===== 顶部步骤号条 ===== -->
  <line x1="40" y1="62" x2="1470" y2="62" stroke="#000000" stroke-width="1"/>
  <line x1="40" y1="76" x2="1470" y2="76" stroke="#000000" stroke-width="1"/>
  <text x="272.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">① 提交</text>
  <text x="437.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">② 创建</text>
  <text x="602.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">③ 发支付</text>
  <text x="767.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">④ 扣款</text>
  <text x="932.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">⑤ 支付成功</text>
  <text x="1097.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">⑥ 拣货</text>
  <text x="1262.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">⑦ 发货</text>
  <text x="1427.5" y="73" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">⑧ 收货</text>

  <!-- ===== 步骤列分隔线(竖向,贯穿所有泳道) ===== -->
  <line x1="355" y1="62" x2="355" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="520" y1="62" x2="520" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="685" y1="62" x2="685" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="850" y1="62" x2="850" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="1015" y1="62" x2="1015" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="1180" y1="62" x2="1180" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="1345" y1="62" x2="1345" y2="600" stroke="#999999" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- ===== 泳道交替底色 ===== -->
  <!-- 泳道 0:用户(y=80-210) 浅 -->
  <rect x="40" y="80" width="1430" height="130" fill="#F5F5F5"/>
  <!-- 泳道 1:订单中心(y=210-340) 白(更浅) -->
  <rect x="40" y="210" width="1430" height="130" fill="#FFFFFF"/>
  <!-- 泳道 2:支付(y=340-470) 浅 -->
  <rect x="40" y="340" width="1430" height="130" fill="#F5F5F5"/>
  <!-- 泳道 3:仓储(y=470-600) 白 -->
  <rect x="40" y="470" width="1430" height="130" fill="#FFFFFF"/>

  <!-- ===== 泳道分隔线(横向) ===== -->
  <line x1="40" y1="80" x2="1470" y2="80" stroke="#000000" stroke-width="1"/>
  <line x1="40" y1="210" x2="1470" y2="210" stroke="#000000" stroke-width="0.8"/>
  <line x1="40" y1="340" x2="1470" y2="340" stroke="#000000" stroke-width="0.8"/>
  <line x1="40" y1="470" x2="1470" y2="470" stroke="#000000" stroke-width="0.8"/>
  <line x1="40" y1="600" x2="1470" y2="600" stroke="#000000" stroke-width="1"/>

  <!-- ===== 泳道标题列(左侧 150 宽) ===== -->
  <rect x="40" y="80" width="150" height="520" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <line x1="190" y1="80" x2="190" y2="600" stroke="#000000" stroke-width="1"/>

  <!-- 泳道标题(垂直居中) -->
  <text x="115" y="149" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">用户</text>
  <text x="115" y="166" font-size="9" font-style="italic" fill="#555555" text-anchor="middle">Customer</text>

  <text x="115" y="279" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">订单中心</text>
  <text x="115" y="296" font-size="9" font-style="italic" fill="#555555" text-anchor="middle">Order Center</text>

  <text x="115" y="409" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">支付服务</text>
  <text x="115" y="426" font-size="9" font-style="italic" fill="#555555" text-anchor="middle">Payment</text>

  <text x="115" y="539" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">仓储</text>
  <text x="115" y="556" font-size="9" font-style="italic" fill="#555555" text-anchor="middle">Warehouse</text>

  <!-- 泳道标题列横向分隔 -->
  <line x1="40" y1="210" x2="190" y2="210" stroke="#000000" stroke-width="0.8"/>
  <line x1="40" y1="340" x2="190" y2="340" stroke="#000000" stroke-width="0.8"/>
  <line x1="40" y1="470" x2="190" y2="470" stroke="#000000" stroke-width="0.8"/>

  <!-- ============ 连接箭头(先画,被节点遮挡端点) ============ -->

  <!-- 1→2: 步骤1框底(272.5,190) → 步骤2框左边(367.5,275) 跨道下行,L 形 -->
  <path d="M 272.5,190 L 272.5,275 L 358.5,275" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="358.5,269 367.5,275 358.5,281" fill="#000000"/>

  <!-- 2→3: 步骤2框右(507.5,275) → 步骤3框左(532.5,275) 同道水平 -->
  <line x1="507.5" y1="275" x2="523.5" y2="275" stroke="#000000" stroke-width="1.5"/>
  <polygon points="523.5,269 532.5,275 523.5,281" fill="#000000"/>

  <!-- 3→4: 步骤3框底(602.5,320) → 步骤4框顶(767.5,360) 跨道下行
       L 形:垂直下到 360 中点,水平到步骤4列,垂直下到框顶 -->
  <path d="M 602.5,320 L 602.5,340 L 767.5,340 L 767.5,351" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="761.5,349 767.5,360 773.5,349" fill="#000000"/>

  <!-- 4→5: 步骤4框顶(767.5,360) → 步骤5框左(862.5,275) 跨道上行(回调)
       L 形:垂直上到 275,水平到步骤5框左 -->
  <path d="M 767.5,360 L 767.5,275 L 853.5,275" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="853.5,269 862.5,275 853.5,281" fill="#000000"/>
  <text x="815" y="268" font-size="8" font-style="italic" fill="#888888">回调</text>

  <!-- 5→6: 步骤5框底(932.5,320) → 步骤6框顶(1097.5,490) 跨道下行(跨2道)
       L 形:垂直下到 490 上方,水平到步骤6列,垂直下到框顶 -->
  <path d="M 932.5,320 L 932.5,470 L 1097.5,470 L 1097.5,481" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1091.5,479 1097.5,490 1103.5,479" fill="#000000"/>

  <!-- 6→7: 步骤6框右(1167.5,535) → 步骤7框左(1192.5,535) 同道水平 -->
  <line x1="1167.5" y1="535" x2="1183.5" y2="535" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1183.5,529 1192.5,535 1183.5,541" fill="#000000"/>

  <!-- 7→8: 步骤7框顶(1262.5,490) → 步骤8框左(1357.5,145) 跨道上行(跨3道)
       L 形:垂直上到 145,水平到步骤8框左 -->
  <path d="M 1262.5,490 L 1262.5,145 L 1348.5,145" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1348.5,139 1357.5,145 1348.5,151" fill="#000000"/>

  <!-- 4→2(支付失败回退):虚线反向,(767.5,405) → (437.5,305) -->
  <!-- 路径:从步骤4左中 (697.5,405) 水平左到 x=540,垂直上到 y=305,水平左到步骤2右 (507.5,305) -->
  <path d="M 697.5,405 L 540,405 L 540,305 L 516.5,305" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="516.5,299 507.5,305 516.5,311" fill="#888888"/>
  <text x="610" y="398" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">支付失败 · 回退</text>

  <!-- ============ 8 个步骤节点 ============ -->

  <!-- 步骤 1: 提交订单 (272.5, 145) 用户道 -->
  <rect x="202.5" y="100" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="215" cy="113" r="9" fill="#000000"/>
  <text x="215" y="117" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="272.5" y="143" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">提交订单</text>
  <text x="272.5" y="160" font-size="9" fill="#555555" text-anchor="middle">填地址、确认商品</text>
  <text x="272.5" y="174" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Submit Order</text>

  <!-- 步骤 2: 创建订单 (437.5, 275) 订单中心道 -->
  <rect x="367.5" y="230" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="380" cy="243" r="9" fill="#000000"/>
  <text x="380" y="247" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="437.5" y="273" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">创建订单</text>
  <text x="437.5" y="290" font-size="9" fill="#555555" text-anchor="middle">生成单号、锁库存</text>
  <text x="437.5" y="304" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Create Order</text>

  <!-- 步骤 3: 发起支付 (602.5, 275) 订单中心道 -->
  <rect x="532.5" y="230" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="545" cy="243" r="9" fill="#000000"/>
  <text x="545" y="247" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="602.5" y="273" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">发起支付</text>
  <text x="602.5" y="290" font-size="9" fill="#555555" text-anchor="middle">调用支付网关</text>
  <text x="602.5" y="304" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Initiate Pay</text>

  <!-- 步骤 4: 扣款处理 (767.5, 405) 支付道 — 实心强调(关键风险点) -->
  <rect x="697.5" y="360" width="140" height="90" rx="0" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <circle cx="710" cy="373" r="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
  <text x="710" y="377" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">4</text>
  <text x="767.5" y="403" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">扣款处理</text>
  <text x="767.5" y="420" font-size="9" fill="#CCCCCC" text-anchor="middle">风控校验、扣账</text>
  <text x="767.5" y="434" font-size="8" font-style="italic" fill="#999999" text-anchor="middle">Charge</text>

  <!-- 步骤 5: 支付成功 (932.5, 275) 订单中心道 -->
  <rect x="862.5" y="230" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="875" cy="243" r="9" fill="#000000"/>
  <text x="875" y="247" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="932.5" y="273" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">支付成功</text>
  <text x="932.5" y="290" font-size="9" fill="#555555" text-anchor="middle">更新状态、通知仓储</text>
  <text x="932.5" y="304" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Pay Success</text>

  <!-- 步骤 6: 拣货打包 (1097.5, 535) 仓储道 -->
  <rect x="1027.5" y="490" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="1040" cy="503" r="9" fill="#000000"/>
  <text x="1040" y="507" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="1097.5" y="533" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">拣货打包</text>
  <text x="1097.5" y="550" font-size="9" fill="#555555" text-anchor="middle">出库准备</text>
  <text x="1097.5" y="564" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Pick &amp; Pack</text>

  <!-- 步骤 7: 发货配送 (1262.5, 535) 仓储道 -->
  <rect x="1192.5" y="490" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="1205" cy="503" r="9" fill="#000000"/>
  <text x="1205" y="507" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="1262.5" y="533" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">发货配送</text>
  <text x="1262.5" y="550" font-size="9" fill="#555555" text-anchor="middle">物流出库</text>
  <text x="1262.5" y="564" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Ship</text>

  <!-- 步骤 8: 确认收货 (1427.5, 145) 用户道 -->
  <rect x="1357.5" y="100" width="140" height="90" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle cx="1370" cy="113" r="9" fill="#000000"/>
  <text x="1370" y="117" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="1427.5" y="143" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">确认收货</text>
  <text x="1427.5" y="160" font-size="9" fill="#555555" text-anchor="middle">完成订单</text>
  <text x="1427.5" y="174" font-size="8" font-style="italic" fill="#888888" text-anchor="middle">Confirm</text>

  <!-- ============ 图例 + 图注 ============ -->
  <!-- 图例 -->
  <line x1="40" y1="615" x2="80" y2="615" stroke="#000000" stroke-width="1.5"/>
  <polygon points="74,612 80,615 74,618" fill="#000000"/>
  <text x="88" y="619" font-size="9" fill="#555555">正常流转</text>

  <line x1="180" y1="615" x2="220" y2="615" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="214,612 220,615 214,618" fill="#888888"/>
  <text x="228" y="619" font-size="9" fill="#555555">失败回退</text>

  <rect x="320" y="609" width="14" height="12" rx="0" fill="#000000"/>
  <text x="342" y="619" font-size="9" fill="#555555">关键节点（实心强调）</text>

  <rect x="490" y="609" width="14" height="12" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="512" y="619" font-size="9" fill="#555555">终点（加粗强调）</text>

  <!-- 图注 -->
  <text x="755" y="650" font-size="10" font-style="italic" fill="#555555" text-anchor="middle">Figure 1. 电商订单全流程。实线表示正常流转，虚线表示支付失败回退；关键风险点（扣款）用实心节点强调。</text>
</svg>
