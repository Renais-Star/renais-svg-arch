<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1000" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="850" height="1000" fill="#FFFFFF"/>
  <rect width="850" height="1000" fill="url(#grid)"/>

  <!-- ===== 总标题 ===== -->
  <text x="425" y="28" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">贷款审批流程 · Loan Approval Flow</text>
  <text x="425" y="46" font-size="9" fill="#64748b" text-anchor="middle">纵向泳道  ·  4 角色 × 7 步骤  ·  从上到下流转</text>

  <!-- ===== 泳道标题行 (y=60-104) ===== -->
  <rect x="30" y="60" width="800" height="44" rx="6" fill="#1e293b"/>
  <text x="130" y="88" font-size="12" font-weight="700" fill="#22d3ee" text-anchor="middle">申请人 · Applicant</text>
  <text x="330" y="88" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">风控 · Risk</text>
  <text x="530" y="88" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">信贷员 · Officer</text>
  <text x="730" y="88" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">放款 · Disburse</text>

  <!-- ===== 4 条泳道主体 (y=104-909) ===== -->
  <!-- 泳道0:申请人 cyan 浅 -->
  <rect x="30" y="104" width="200" height="805" fill="#e0f7fa" fill-opacity="0.5"/>
  <!-- 泳道1:风控 violet 浅 -->
  <rect x="230" y="104" width="200" height="805" fill="#ede7f6" fill-opacity="0.5"/>
  <!-- 泳道2:信贷员 emerald 浅 -->
  <rect x="430" y="104" width="200" height="805" fill="#e8f5e9" fill-opacity="0.5"/>
  <!-- 泳道3:放款 amber 浅 -->
  <rect x="630" y="104" width="200" height="805" fill="#fff8e1" fill-opacity="0.5"/>

  <!-- 泳道纵向分隔线 -->
  <line x1="230" y1="60" x2="230" y2="909" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="430" y1="60" x2="430" y2="909" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="630" y1="60" x2="630" y2="909" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- 步骤行横向虚线(辅助对齐) -->
  <line x1="30" y1="219" x2="830" y2="219" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="30" y1="334" x2="830" y2="334" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="30" y1="449" x2="830" y2="449" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="30" y1="564" x2="830" y2="564" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="30" y1="679" x2="830" y2="679" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="30" y1="794" x2="830" y2="794" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- 泳道外框 -->
  <rect x="30" y="60" width="800" height="849" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ============ 连接箭头 ============ -->
  <!-- 关键:三角顶点必须指向【目标框顶】(cy-45),不是框中心!
       否则三角伸入框内被白色框覆盖,用户看不到箭头。 -->

  <!-- 1→2: 步骤1框底(130,206.5) → 步骤2框顶(330,231.5) 跨道右下 -->
  <path d="M 130,206.5 L 130,219 L 330,219 L 330,222.5" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="324,220.5 330,231.5 336,220.5" fill="#fb923c"/>

  <!-- 2→3: 步骤2框底(330,321.5) → 步骤3框顶(330,346.5) 同道向下 -->
  <line x1="330" y1="321.5" x2="330" y2="337.5" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="324,335.5 330,346.5 336,335.5" fill="#fb923c"/>

  <!-- 3→4: 步骤3框底(330,436.5) → 步骤4框顶(530,461.5) 跨道右下 -->
  <path d="M 330,436.5 L 330,449 L 530,449 L 530,452.5" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="524,450.5 530,461.5 536,450.5" fill="#fb923c"/>

  <!-- 3→5 自动通过(跳过步骤4): 步骤3框底偏右(380,436.5) → 步骤5框顶(530,576.5)
       x=380 在步骤4框左边(445)外侧,不穿过步骤4 -->
  <path d="M 380,436.5 L 380,560 L 530,560 L 530,567.5" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <polygon points="524,565.5 530,576.5 536,565.5" fill="#fb923c" fill-opacity="0.5"/>
  <text x="395" y="500" font-size="8" font-style="italic" fill="#94a3b8">小额自动通过</text>

  <!-- 4→5: 步骤4框底(530,551.5) → 步骤5框顶(530,576.5) 同道向下 -->
  <line x1="530" y1="551.5" x2="530" y2="567.5" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="524,565.5 530,576.5 536,565.5" fill="#fb923c"/>

  <!-- 5→6: 步骤5框底(530,666.5) → 步骤6框顶(730,691.5) 跨道右下 -->
  <path d="M 530,666.5 L 530,679 L 730,679 L 730,682.5" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="724,680.5 730,691.5 736,680.5" fill="#fb923c"/>

  <!-- 6→7: 步骤6框底(730,781.5) → 步骤7框顶(130,806.5) 跨道左下(跨3道) -->
  <path d="M 730,781.5 L 730,794 L 130,794 L 130,797.5" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="124,795.5 130,806.5 136,795.5" fill="#fb923c"/>

  <!-- 5→1 拒绝回退(红虚线向上): 步骤5框右(615,621.5) → 步骤1框右(215,161.5)
       x=640 在所有框右侧之外,不穿过任何节点 -->
  <path d="M 615,621.5 L 640,621.5 L 640,161.5 L 226,161.5" fill="none" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="226,155.5 215,161.5 226,167.5" fill="#e53935"/>
  <text x="650" y="400" font-size="8" font-style="italic" fill="#e53935">拒绝 · 补件</text>

  <!-- ============ 7 个步骤节点 ============ -->

  <!-- 步骤1: 提交申请 (130, 161.5) 申请人道 cyan -->
  <rect x="45" y="116.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#00acc1" stroke-width="1.5"/>
  <circle cx="60" cy="131.5" r="9" fill="#00acc1"/>
  <text x="60" y="135" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="130" y="160" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">提交申请</text>
  <text x="130" y="177" font-size="9" fill="#64748b" text-anchor="middle">填资料、授权征信</text>
  <text x="130" y="191" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Submit</text>

  <!-- 步骤2: 征信查询 (330, 276.5) 风控道 violet -->
  <rect x="245" y="231.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#7e57c2" stroke-width="1.5"/>
  <circle cx="260" cy="246.5" r="9" fill="#7e57c2"/>
  <text x="260" y="250" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="330" y="275" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">征信查询</text>
  <text x="330" y="292" font-size="9" fill="#64748b" text-anchor="middle">央行征信、多头借贷</text>
  <text x="330" y="306" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Credit Check</text>

  <!-- 步骤3: 风险评分 (330, 391.5) 风控道 violet -->
  <rect x="245" y="346.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#7e57c2" stroke-width="1.5"/>
  <circle cx="260" cy="361.5" r="9" fill="#7e57c2"/>
  <text x="260" y="365" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="330" y="390" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">风险评分</text>
  <text x="330" y="407" font-size="9" fill="#64748b" text-anchor="middle">模型打分、建议额度</text>
  <text x="330" y="421" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Risk Score</text>

  <!-- 步骤4: 人工复核 (530, 506.5) 信贷员道 emerald -->
  <rect x="445" y="461.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#2ecc71" stroke-width="1.5"/>
  <circle cx="460" cy="476.5" r="9" fill="#2ecc71"/>
  <text x="460" y="480" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="530" y="505" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">人工复核</text>
  <text x="530" y="522" font-size="9" fill="#64748b" text-anchor="middle">大额 / 边缘案例</text>
  <text x="530" y="536" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Manual Review</text>

  <!-- 步骤5: 审批决策 (530, 621.5) 信贷员道 emerald -->
  <rect x="445" y="576.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#2ecc71" stroke-width="1.8"/>
  <circle cx="460" cy="591.5" r="9" fill="#2ecc71"/>
  <text x="460" y="595" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="530" y="620" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">审批决策</text>
  <text x="530" y="637" font-size="9" fill="#64748b" text-anchor="middle">批准 / 拒绝 / 补件</text>
  <text x="530" y="651" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Decision</text>

  <!-- 步骤6: 签约放款 (730, 736.5) 放款道 amber -->
  <rect x="645" y="691.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#f9a825" stroke-width="1.5"/>
  <circle cx="660" cy="706.5" r="9" fill="#f9a825"/>
  <text x="660" y="710" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="730" y="735" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">签约放款</text>
  <text x="730" y="752" font-size="9" fill="#64748b" text-anchor="middle">电子合同、资金划拨</text>
  <text x="730" y="766" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Disburse</text>

  <!-- 步骤7: 到账通知 (130, 851.5) 申请人道 cyan -->
  <rect x="45" y="806.5" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#00acc1" stroke-width="2.5"/>
  <circle cx="60" cy="821.5" r="9" fill="#00acc1"/>
  <text x="60" y="825" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="130" y="850" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">到账通知</text>
  <text x="130" y="867" font-size="9" fill="#64748b" text-anchor="middle">短信 / App 推送</text>
  <text x="130" y="881" font-size="8" font-style="italic" fill="#94a3b8" text-anchor="middle">Notify</text>

  <!-- ============ 图例 + 图注 ============ -->
  <line x1="30" y1="930" x2="60" y2="930" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="54,927 60,930 54,933" fill="#fb923c"/>
  <text x="68" y="934" font-size="9" fill="#64748b">正常流转</text>

  <line x1="160" y1="930" x2="190" y2="930" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,3" stroke-opacity="0.6"/>
  <text x="198" y="934" font-size="9" fill="#64748b">小额自动通过</text>

  <line x1="300" y1="930" x2="330" y2="930" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="338" y="934" font-size="9" fill="#64748b">拒绝回退</text>

  <text x="425" y="970" font-size="9" font-style="italic" fill="#94a3b8" text-anchor="middle">图 2 · 贷款审批全流程（纵向泳道）。实线为主流程，浅虚线为小额自动通过，红虚线为拒绝补件。</text>
</svg>
