<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="grad-hub" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#1E6BB8"/>
    </linearGradient>
    <linearGradient id="grad-spoke" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3A8BDB"/>
      <stop offset="100%" stop-color="#6AB0F0"/>
    </linearGradient>
    <linearGradient id="grad-bottom" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#634FE0"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1000" height="820" fill="#F8FAFC"/>

  <!-- ===== 总标题 ===== -->
  <text x="500" y="34" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">统一身份认证中心 · IAM Center Architecture</text>
  <text x="500" y="54" font-size="10" fill="#64748B" text-anchor="middle">SSO 单点登录  ·  RBAC 角色权限  ·  MFA 多因子认证  ·  风险自适应</text>

  <!-- ============ 连线层（先画，被节点遮挡） ============ -->
  <!-- 中心 (500,430)，Hub 半宽 110 半高 55；Spoke 半宽 80 半高 40 -->

  <!-- 1. 中心 → 上 Spoke(500,150)：垂直向上 -->
  <line x1="500" y1="375" x2="500" y2="191" stroke="#1E6BB8" stroke-width="2"/>
  <polygon points="494,193 500,182 506,193" fill="#1E6BB8"/>
  <text x="514" y="285" font-size="9" fill="#64748B">账号同步</text>

  <!-- 2. 中心 → 右上 Spoke(699,231)：双向 -->
  <line x1="588" y1="389" x2="641" y2="262" stroke="#1E6BB8" stroke-width="1.8"/>
  <polygon points="636,266 644,257 645,267" fill="#1E6BB8"/>
  <polygon points="591,385 583,394 582,384" fill="#1E6BB8"/>
  <text x="640" y="320" font-size="9" fill="#64748B">令牌校验</text>

  <!-- 3. 中心 → 右 Spoke(780,430)：水平向右 -->
  <line x1="611" y1="430" x2="699" y2="430" stroke="#1E6BB8" stroke-width="2"/>
  <polygon points="701,424 712,430 701,436" fill="#1E6BB8"/>
  <text x="655" y="422" font-size="9" fill="#64748B" text-anchor="middle">签发</text>

  <!-- 4. 中心 → 右下 Spoke(699,629) -->
  <line x1="588" y1="471" x2="641" y2="598" stroke="#1E6BB8" stroke-width="2"/>
  <polygon points="636,594 645,601 636,604" fill="#1E6BB8"/>
  <text x="640" y="540" font-size="9" fill="#64748B">下发</text>

  <!-- 5. 中心 → 下 Spoke(500,710)：垂直向下 -->
  <line x1="500" y1="485" x2="500" y2="669" stroke="#1E6BB8" stroke-width="2"/>
  <polygon points="494,667 500,678 506,667" fill="#1E6BB8"/>
  <text x="514" y="585" font-size="9" fill="#64748B">下发</text>

  <!-- 6. 中心 → 左下 Spoke(301,629) -->
  <line x1="412" y1="471" x2="359" y2="598" stroke="#1E6BB8" stroke-width="2"/>
  <polygon points="364,594 355,601 364,604" fill="#1E6BB8"/>
  <text x="360" y="540" font-size="9" fill="#64748B" text-anchor="end">下发</text>

  <!-- 7. 中心 → 左 Spoke(220,430)：水平向左 -->
  <line x1="389" y1="430" x2="301" y2="430" stroke="#E63946" stroke-width="1.8" stroke-dasharray="6,4"/>
  <polygon points="303,424 292,430 303,436" fill="#E63946"/>
  <text x="345" y="422" font-size="9" fill="#64748B" text-anchor="middle">操作上报</text>

  <!-- 8. 中心 → 左上 Spoke(301,231)：双向(风控) -->
  <!-- 风控框右边 x=381、下边 y=271；线段从中心方向 (412,389) 到风控框右下角外 (375,275) -->
  <line x1="412" y1="389" x2="375" y2="278" stroke="#E63946" stroke-width="1.8" stroke-dasharray="6,4"/>
  <polygon points="369,276 375,272 378,280" fill="#E63946"/>
  <polygon points="407,385 416,394 414,384" fill="#E63946"/>
  <text x="360" y="320" font-size="9" fill="#64748B" text-anchor="end">风险评估</text>

  <!-- ============ Hub：中心 IAM ============ -->
  <!-- 阴影 -->
  <rect x="391" y="378" width="220" height="110" rx="14" fill="#000000" fill-opacity="0.08"/>
  <!-- 主体 -->
  <rect x="390" y="375" width="220" height="110" rx="14" fill="url(#grad-hub)"/>
  <!-- 高光线 -->
  <line x1="404" y1="376" x2="596" y2="376" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <!-- 中心图标（user + 锁） -->
  <g transform="translate(484.4,385) scale(1.3)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4,21 C4,16.5 7.5,13 12,13 C16.5,13 20,16.5 20,21"/>
    </g>
  </g>
  <text x="500" y="425" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">IAM 中心</text>
  <text x="500" y="442" font-size="10" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Identity &amp; Access Management</text>
  <text x="500" y="456" font-size="8" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">认证 · 鉴权 · 令牌签发</text>

  <!-- ============ 8 个 Spoke ============ -->

  <!-- 1. 上：用户目录 (500,150) -->
  <rect x="421" y="113" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="420" y="110" width="160" height="80" rx="8" fill="url(#grad-spoke)"/>
  <g transform="translate(490.4,118) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="8" ry="2.5"/>
      <path d="M4,5 L4,19 C4,20.4 7.6,21.5 12,21.5 C16.4,21.5 20,20.4 20,19 L20,5"/>
      <path d="M4,10 C4,11.4 7.6,12.5 12,12.5 C16.4,12.5 20,11.4 20,10"/>
    </g>
  </g>
  <text x="500" y="148" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">用户目录</text>
  <text x="500" y="162" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">User Directory</text>
  <text x="500" y="174" font-size="8" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">LDAP / AD</text>

  <!-- 2. 右上：SSO 门户 (699,231) -->
  <rect x="620" y="194" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="619" y="191" width="160" height="80" rx="8" fill="url(#grad-spoke)"/>
  <g transform="translate(689.4,199) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="11" width="15" height="10" rx="2"/>
      <path d="M7.5,11 L7.5,7.5 C7.5,5 9.5,3 12,3 C14.5,3 16.5,5 16.5,7.5 L16.5,11"/>
      <line x1="12" y1="14.5" x2="12" y2="17.5"/>
      <circle cx="12" cy="14.5" r="1.4"/>
    </g>
  </g>
  <text x="699" y="229" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">SSO 门户</text>
  <text x="699" y="243" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">SSO Portal</text>
  <text x="699" y="255" font-size="8" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">统一登录入口</text>

  <!-- 3. 右：ERP (780,430) -->
  <rect x="701" y="393" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="700" y="390" width="160" height="80" rx="8" fill="url(#grad-spoke)"/>
  <g transform="translate(770.4,398) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="7" rx="1.5"/>
      <rect x="3" y="13" width="18" height="7" rx="1.5"/>
      <circle cx="6.5" cy="7.5" r="0.4" fill="currentColor" stroke="none"/>
      <line x1="10" y1="7.5" x2="14" y2="7.5"/>
      <circle cx="6.5" cy="16.5" r="0.4" fill="currentColor" stroke="none"/>
      <line x1="10" y1="16.5" x2="14" y2="16.5"/>
    </g>
  </g>
  <text x="780" y="428" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">业务系统 A</text>
  <text x="780" y="442" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">ERP · 资源计划</text>

  <!-- 4. 右下：CRM (699,629) -->
  <rect x="620" y="592" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="619" y="589" width="160" height="80" rx="8" fill="url(#grad-spoke)"/>
  <g transform="translate(689.4,597) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4,21 C4,16.5 7.5,13 12,13 C16.5,13 20,16.5 20,21"/>
    </g>
  </g>
  <text x="699" y="627" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">业务系统 B</text>
  <text x="699" y="641" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">CRM · 客户管理</text>

  <!-- 5. 下：OA (500,710) -->
  <rect x="421" y="673" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="420" y="670" width="160" height="80" rx="8" fill="url(#grad-spoke)"/>
  <g transform="translate(490.4,678) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="4" width="19" height="16" rx="2"/>
      <line x1="2.5" y1="8" x2="21.5" y2="8"/>
      <circle cx="5.5" cy="6" r="0.5" fill="currentColor" stroke="none"/>
      <circle cx="7.5" cy="6" r="0.5" fill="currentColor" stroke="none"/>
      <circle cx="9.5" cy="6" r="0.5" fill="currentColor" stroke="none"/>
      <path d="M6,14 L10,14"/>
      <path d="M6,17 L14,17"/>
    </g>
  </g>
  <text x="500" y="708" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">业务系统 C</text>
  <text x="500" y="722" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">OA · 办公自动化</text>

  <!-- 6. 左下：BI (301,629) -->
  <rect x="222" y="592" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="221" y="589" width="160" height="80" rx="8" fill="url(#grad-spoke)"/>
  <g transform="translate(291.4,597) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,3 L3,20 L21,20"/>
      <path d="M6,16 L10,12 L13,14 L18,7"/>
      <circle cx="10" cy="12" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="18" cy="7" r="0.6" fill="currentColor" stroke="none"/>
    </g>
  </g>
  <text x="301" y="627" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">业务系统 D</text>
  <text x="301" y="641" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">BI · 数据报表</text>

  <!-- 7. 左：审计日志 (220,430) — 红色安全系 -->
  <rect x="141" y="393" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="140" y="390" width="160" height="80" rx="8" fill="#E63946"/>
  <g transform="translate(210.4,398) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5,2.5 L15,2.5 L19,6.5 L19,21.5 L5,21.5 Z"/>
      <path d="M15,2.5 L15,6.5 L19,6.5"/>
      <line x1="8" y1="11" x2="16" y2="11"/>
      <line x1="8" y1="14" x2="16" y2="14"/>
      <line x1="8" y1="17" x2="13" y2="17"/>
    </g>
  </g>
  <text x="220" y="428" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">审计日志</text>
  <text x="220" y="442" font-size="9" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">Audit Log</text>
  <text x="220" y="454" font-size="8" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">操作留痕</text>

  <!-- 8. 左上：风控引擎 (301,231) — 红色安全系 -->
  <rect x="222" y="194" width="160" height="80" rx="8" fill="#000000" fill-opacity="0.06"/>
  <rect x="221" y="191" width="160" height="80" rx="8" fill="#E63946"/>
  <g transform="translate(291.4,199) scale(0.8)" color="#FFFFFF">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,3 L3,20 L21,20"/>
      <path d="M6,16 L10,12 L13,14 L18,7"/>
      <circle cx="10" cy="12" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="13" cy="14" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="18" cy="7" r="0.6" fill="currentColor" stroke="none"/>
    </g>
  </g>
  <text x="301" y="229" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">风控引擎</text>
  <text x="301" y="243" font-size="9" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">Risk Engine</text>
  <text x="301" y="255" font-size="8" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">异常登录检测</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="772" width="940" height="32" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <!-- 渐变蓝块 -->
  <rect x="44" y="782" width="14" height="12" rx="2" fill="url(#grad-spoke)"/>
  <text x="64" y="792" font-size="9" fill="#374151">业务节点</text>
  <!-- 红块 -->
  <rect x="124" y="782" width="14" height="12" rx="2" fill="#E63946"/>
  <text x="144" y="792" font-size="9" fill="#374151">安全节点</text>
  <!-- 蓝实线 -->
  <line x1="214" y1="788" x2="234" y2="788" stroke="#1E6BB8" stroke-width="2"/>
  <polygon points="232,785 238,788 232,791" fill="#1E6BB8"/>
  <text x="244" y="792" font-size="9" fill="#374151">业务调用（单向/双向）</text>
  <!-- 红虚线 -->
  <line x1="374" y1="788" x2="394" y2="788" stroke="#E63946" stroke-width="1.8" stroke-dasharray="6,4"/>
  <polygon points="392,785 398,788 392,791" fill="#E63946"/>
  <text x="404" y="792" font-size="9" fill="#374151">安全审计（虚线）</text>
  <!-- 中心 -->
  <rect x="510" y="782" width="14" height="12" rx="2" fill="url(#grad-hub)"/>
  <text x="530" y="792" font-size="9" fill="#374151">IAM 核心枢纽</text>
  <text x="900" y="792" font-size="9" fill="#64748B" text-anchor="end">图 1 · 统一身份认证中心架构 · v1.0</text>
</svg>
