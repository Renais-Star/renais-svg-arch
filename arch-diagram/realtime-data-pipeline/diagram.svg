  <rect x="330" y="100" width="200" height="250" rx="10" fill="#e8f5e9" fill-opacity="0.6" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="342" y="122" font-size="11" font-weight="700" fill="#2ecc71">接入采集 · Ingest</text>

