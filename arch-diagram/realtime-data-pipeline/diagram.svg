  <!-- 列中心 y = 70 + 310/2 = 225 ✓ -->

  <!-- ===== 底部说明 ===== -->
  <text x="730" y="412" font-size="9" fill="#94a3b8" text-anchor="middle">每个阶段解耦 · 总线统一缓冲 · 流处理可水平扩展 · 数据流方向 左 → 右</text>
