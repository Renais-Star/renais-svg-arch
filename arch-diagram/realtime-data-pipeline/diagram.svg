  <text x="86" y="308" font-size="8" fill="#64748b">第三方回调</text>

  <!-- 列中心 y = 70 + 310/2 = 225 -->

  <!-- ============ 箭头 Stage1 → Stage2 ============ -->
  <line x1="230" y1="225" x2="321" y2="225" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="319,219 330,225 319,231" fill="#fb923c"/>
  <text x="275" y="218" font-size="8" fill="#64748b" text-anchor="middle">采集</text>

