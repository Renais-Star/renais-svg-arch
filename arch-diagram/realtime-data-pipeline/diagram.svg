<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 440" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1460" height="440" fill="#FFFFFF"/>
  <rect width="1460" height="440" fill="url(#grid)"/>

  <!-- ===== 总标题 + 数据流标注 ===== -->
  <text x="730" y="28" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">实时数据管道 · Real-time Data Pipeline</text>
  <text x="730" y="46" font-size="9" fill="#64748b" text-anchor="middle">端到端延迟 &lt; 5s   ·   峰值吞吐 10 万 TPS   ·   流向：左 → 右</text>

  <!-- ============ Stage 1: 数据源 (cyan) ============ -->
  <rect x="30" y="70" width="200" height="310" rx="10" fill="#e0f7fa" fill-opacity="0.6" stroke="#00acc1" stroke-width="1.5"/>
  <text x="42" y="92" font-size="11" font-weight="700" fill="#00acc1">数据源 · Source</text>

