  <rect x="40" y="110" width="180" height="46" rx="6" fill="#FFFFFF" stroke="#00acc1" stroke-width="1.2"/>
  <g transform="translate(52,123) scale(0.7)" color="#00acc1">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="8" ry="2.5"/>
      <path d="M4,5 L4,19 C4,20.4 7.6,21.5 12,21.5 C16.4,21.5 20,20.4 20,19 L20,5"/>
      <path d="M4,10 C4,11.4 7.6,12.5 12,12.5 C16.4,12.5 20,11.4 20,10"/>
      <path d="M4,15 C4,16.4 7.6,17.5 12,17.5 C16.4,17.5 20,16.4 20,15"/>
    </g>
  </g>
  <text x="86" y="132" font-size="10" font-weight="600" fill="#1e293b">MySQL Binlog</text>
  <text x="86" y="146" font-size="8" fill="#64748b">业务库变更</text>

  <!-- 组件 1.2: App Log -->
  <rect x="40" y="164" width="180" height="46" rx="6" fill="#FFFFFF" stroke="#00acc1" stroke-width="1.2"/>
  <g transform="translate(52,177) scale(0.7)" color="#00acc1">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5,2.5 L15,2.5 L19,6.5 L19,21.5 L5,21.5 Z"/>
      <path d="M15,2.5 L15,6.5 L19,6.5"/>
