  <!-- 列中心 y = 100 + 250/2 = 225 ✓ -->

  <!-- ============ 箭头 Stage4 → Stage5 ============ -->
  <line x1="1130" y1="225" x2="1221" y2="225" stroke="#fb923c" stroke-width="1.5"/>
  <polygon points="1219,219 1230,225 1219,231" fill="#fb923c"/>
  <text x="1175" y="218" font-size="8" fill="#64748b" text-anchor="middle">分发</text>

