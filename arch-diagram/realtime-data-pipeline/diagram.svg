  <rect x="340" y="140" width="180" height="46" rx="6" fill="#FFFFFF" stroke="#2ecc71" stroke-width="1.2"/>
  <g transform="translate(352,153) scale(0.7)" color="#2ecc71">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
