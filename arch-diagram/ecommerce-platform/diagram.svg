  <text x="500" y="590" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">MongoDB</text>
  <text x="500" y="606" font-size="9" fill="#94a3b8" text-anchor="middle">文档型 · 详情/评价</text>

  <rect x="620" y="568" width="200" height="52" rx="6" fill="#0f172a"/>
  <rect x="620" y="568" width="200" height="52" rx="6" fill="#4c1d95" fill-opacity="0.6" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="590" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Object Storage</text>
  <text x="720" y="606" font-size="9" fill="#94a3b8" text-anchor="middle">对象存储 · OSS</text>

  <rect x="840" y="568" width="220" height="52" rx="6" fill="#0f172a"/>
  <rect x="840" y="568" width="220" height="52" rx="6" fill="#4c1d95" fill-opacity="0.6" stroke="#a78bfa" stroke-width="1.2"/>
