  <rect x="970" y="330" width="90" height="60" rx="6" fill="#0f172a"/>
  <rect x="970" y="330" width="90" height="60" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="1.2"/>
