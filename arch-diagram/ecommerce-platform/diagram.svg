  <line x1="1080" y1="110" x2="1100" y2="110" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="1080" y1="230" x2="1100" y2="230" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="1080" y1="350" x2="1100" y2="350" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="1080" y1="470" x2="1100" y2="470" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="1080" y1="585" x2="1100" y2="585" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>

