  <text x="620" y="680" font-size="10" fill="#fde68a" text-anchor="middle">数据规范  ·  接口规范  ·  安全规范  ·  部署规范</text>

  <!-- ============ 图例 ============ -->
  <rect x="200" y="708" width="10" height="10" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1"/>
  <text x="216" y="717" font-size="8" fill="#94a3b8">接入</text>
  <rect x="260" y="708" width="10" height="10" fill="#78350f" fill-opacity="0.4" stroke="#fb923c" stroke-width="1"/>
