    </pattern>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1240" height="730" fill="#0f172a"/>
  <rect width="1240" height="730" fill="url(#grid)"/>

  <!-- ===== 总标题 ===== -->
  <text x="620" y="28" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">电商技术架构 · E-commerce Platform Architecture</text>

  <!-- ===== 左侧栏:安全保障体系(rose) ===== -->
  <rect x="20" y="60" width="120" height="570" rx="10" fill="#881338" fill-opacity="0.4" stroke="#fb7185" stroke-width="1.5"/>
  <text x="80" y="345" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle" transform="rotate(-90 80 345)">安全保障体系 · Security</text>
  <text x="80" y="100" font-size="9" fill="#fecdd3" text-anchor="middle">身份认证</text>
  <text x="80" y="118" font-size="9" fill="#fecdd3" text-anchor="middle">IAM</text>
  <text x="80" y="148" font-size="9" fill="#fecdd3" text-anchor="middle">数据加密</text>
  <text x="80" y="166" font-size="9" fill="#fecdd3" text-anchor="middle">Encryption</text>
  <text x="80" y="196" font-size="9" fill="#fecdd3" text-anchor="middle">风控反欺诈</text>
  <text x="80" y="214" font-size="9" fill="#fecdd3" text-anchor="middle">Risk Control</text>
  <text x="80" y="244" font-size="9" fill="#fecdd3" text-anchor="middle">审计日志</text>
  <text x="80" y="262" font-size="9" fill="#fecdd3" text-anchor="middle">Audit</text>

  <!-- ===== 右侧栏:运维监控体系(emerald) ===== -->
  <rect x="1100" y="60" width="120" height="570" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5"/>
  <text x="1160" y="345" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" transform="rotate(-90 1160 345)">运维监控体系 · Operations</text>
  <text x="1160" y="100" font-size="9" fill="#a7f3d0" text-anchor="middle">链路追踪</text>
  <text x="1160" y="118" font-size="9" fill="#a7f3d0" text-anchor="middle">Tracing</text>
  <text x="1160" y="148" font-size="9" fill="#a7f3d0" text-anchor="middle">指标监控</text>
  <text x="1160" y="166" font-size="9" fill="#a7f3d0" text-anchor="middle">Metrics</text>
  <text x="1160" y="196" font-size="9" fill="#a7f3d0" text-anchor="middle">日志聚合</text>
  <text x="1160" y="214" font-size="9" fill="#a7f3d0" text-anchor="middle">Logging</text>
  <text x="1160" y="244" font-size="9" fill="#a7f3d0" text-anchor="middle">告警通知</text>
  <text x="1160" y="262" font-size="9" fill="#a7f3d0" text-anchor="middle">Alerting</text>

