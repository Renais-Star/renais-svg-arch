  <text x="285" y="477" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Message Queue</text>
  <text x="285" y="492" font-size="8" fill="#94a3b8" text-anchor="middle">消息队列 · RocketMQ</text>

  <rect x="405" y="458" width="210" height="42" rx="6" fill="#0f172a"/>
  <rect x="405" y="458" width="210" height="42" rx="6" fill="#4c1d95" fill-opacity="0.5" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="510" y="477" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Distributed Cache</text>
  <text x="510" y="492" font-size="8" fill="#94a3b8" text-anchor="middle">Redis Cluster</text>

  <rect x="630" y="458" width="210" height="42" rx="6" fill="#0f172a"/>
  <rect x="630" y="458" width="210" height="42" rx="6" fill="#4c1d95" fill-opacity="0.5" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="735" y="477" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Search Engine</text>
  <text x="735" y="492" font-size="8" fill="#94a3b8" text-anchor="middle">Elasticsearch</text>

  <rect x="855" y="458" width="205" height="42" rx="6" fill="#0f172a"/>
  <rect x="855" y="458" width="205" height="42" rx="6" fill="#4c1d95" fill-opacity="0.5" stroke="#a78bfa" stroke-width="1.2"/>
