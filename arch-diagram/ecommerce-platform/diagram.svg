  <line x1="140" y1="230" x2="160" y2="230" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="140" y1="350" x2="160" y2="350" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="140" y1="470" x2="160" y2="470" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <line x1="140" y1="585" x2="160" y2="585" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>

