  <text x="172" y="78" font-size="11" font-weight="700" fill="#22d3ee">用户接入层 · Access Layer</text>

  <!-- 模块 1: Web App -->
  <rect x="180" y="90" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="180" y="90" width="160" height="60" rx="6" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="260" y="116" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Web App</text>
  <text x="260" y="134" font-size="9" fill="#94a3b8" text-anchor="middle">PC 网页商城</text>

  <!-- 模块 2: Mobile App -->
  <rect x="370" y="90" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="370" y="90" width="160" height="60" rx="6" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="450" y="116" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mobile App</text>
  <text x="450" y="134" font-size="9" fill="#94a3b8" text-anchor="middle">iOS / Android</text>

  <!-- 模块 3: Mini Program -->
  <rect x="560" y="90" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="560" y="90" width="160" height="60" rx="6" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="640" y="116" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mini Program</text>
  <text x="640" y="134" font-size="9" fill="#94a3b8" text-anchor="middle">小程序</text>

  <!-- 模块 4: H5 Store -->
  <rect x="750" y="90" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="750" y="90" width="160" height="60" rx="6" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="830" y="116" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">H5 Store</text>
  <text x="830" y="134" font-size="9" fill="#94a3b8" text-anchor="middle">营销 / 落地页</text>

  <!-- 模块 5: Open API -->
  <rect x="940" y="90" width="120" height="60" rx="6" fill="#0f172a"/>
  <rect x="940" y="90" width="120" height="60" rx="6" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/>
